name: Linux Cutwork Service
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deploy/linux/**'
      - 'product/packaging/**'
      - 'release/**'
      - 'global.json'
      - 'NuGet.config'
      - 'Directory.Build.props'
      - '.github/workflows/linux-cli.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet build src/Cutwork.Cli -c Release -p:TargetFrameworks=net10.0
      - name: Actual CLI and service through official MCP client
        run: dotnet run --project tests/Cutwork.CliSmoke -c Release -p:TargetFrameworks=net10.0 -- src/Cutwork.Cli/bin/Release/net10.0/cutwork-cli.dll
      - name: Publish self-contained LIME service
        run: |
          dotnet publish src/Cutwork.Cli -c Release -r linux-x64 --self-contained true -p:TargetFrameworks=net10.0 -o artifacts/cutwork-lime
          artifacts/cutwork-lime/cutwork-cli mcp-catalog > artifacts/cutwork-lime/cutwork-lime.json
          cp deploy/linux/flamoris-cutwork-cli.service artifacts/cutwork-lime/
          mkdir -p artifacts/cutwork-lime/licenses
          cp LICENSE artifacts/cutwork-lime/licenses/Cutwork-LICENSE
          cp packaging/MCP-SDK-LICENSE.txt artifacts/cutwork-lime/licenses/MCP-SDK-LICENSE.txt
          cp "$DOTNET_ROOT/LICENSE.txt" artifacts/cutwork-lime/licenses/DOTNET-LICENSE.txt
          cp "$DOTNET_ROOT/ThirdPartyNotices.txt" artifacts/cutwork-lime/licenses/DOTNET-NOTICES.txt
          cp ~/.nuget/packages/skiasharp/4.154.0/LICENSE.txt artifacts/cutwork-lime/licenses/SkiaSharp-LICENSE.txt
          cp ~/.nuget/packages/skiasharp.nativeassets.linux.nodependencies/4.154.0/THIRD-PARTY-NOTICES.txt artifacts/cutwork-lime/licenses/Skia-NOTICES.txt
          tar -czf artifacts/cutwork-lime-linux-x64.tar.gz -C artifacts/cutwork-lime .
      - uses: actions/upload-artifact@v4
        with:
          name: Cutwork-LIME-linux-x64
          path: artifacts/cutwork-lime-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: Build and verify Kachinco-style resident container
        run: |
          mv artifacts/cutwork-lime artifacts/runtime
          docker build --platform linux/amd64 -f product/packaging/Dockerfile.linux -t cutwork-cli-candidate .
          sudo python3 tests/deployment/verify_resident_container.py cutwork-cli-candidate
          docker image save --output artifacts/image.tar cutwork-cli-candidate
          image_id=$(docker image inspect --format '{{.Id}}' cutwork-cli-candidate)
          python3 product/packaging/package-updater.py --image artifacts/image.tar --image-id "$image_id" --revision "$GITHUB_SHA" --output artifacts/updater
          python3 -m venv artifacts/updater-verify-venv
          artifacts/updater-verify-venv/bin/python -m pip install 'https://github.com/flamoris-jp/flamoris-updater/archive/d3390f5dfbd1b1fe453df714d8219a12cec2706e.zip'
          sudo env GITHUB_ACTIONS=true artifacts/updater-verify-venv/bin/python tests/deployment/verify_updater_catalog.py artifacts/updater/catalog.json --install
          cp deploy/linux/migrate-resident.py deploy/linux/setup-cutwork-lime.py deploy/linux/quarantine-failed-install.py deploy/linux/flamoris-cutwork-cli.service deploy/linux/README.md artifacts/updater/
          (cd artifacts/updater && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: Cutwork-Updater-candidate
          path: artifacts/updater/
          if-no-files-found: error
          retention-days: 3

