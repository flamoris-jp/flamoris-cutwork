name: Windows Portable Package

on:
  pull_request:
    paths:
      - ".gitmodules"
      - "dependencies/flamoris-capture"
      - "src/**"
      - "tests/**"
      - "*.sln"
      - "global.json"
      - "Directory.Build.props"
      - "eng/**"
      - "packaging/**"
      - "product/packaging/**"
      - "docs/phase8-windows-packaging.md"
      - "LICENSE"
      - "README.md"
      - ".github/workflows/windows-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Checkout coordinated MCP 1.4 source for preview validation
        uses: actions/checkout@v4
        with:
          repository: flamoris-jp/flamoris-mcp-core
          ref: 873a8747d544c6c9d4ad75ddb39cabaa7978eef3
          path: .ci/mcp-core
          persist-credentials: false
      - name: Build coordinated MCP packages into temporary CI feed
        shell: pwsh
        run: |
          $feed = Join-Path $PWD 'artifacts/mcp-preview-feed'
          dotnet pack .ci/mcp-core/src/Flamoris.Mcp.Core -c Release -o $feed
          if ($LASTEXITCODE -ne 0) { throw 'Core pack failed.' }
          dotnet pack .ci/mcp-core/src/Flamoris.Mcp.Wpf -c Release -o $feed
          if ($LASTEXITCODE -ne 0) { throw 'Wpf pack failed.' }
          if (!(Test-Path NuGet.config)) { '<configuration><packageSources><clear/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources></configuration>' | Set-Content NuGet.config }
          dotnet nuget add source $feed --name coordinated-mcp-preview --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { throw 'Preview feed setup failed.' }
      - run: dotnet restore Cutwork.sln
      - run: dotnet build Cutwork.sln --configuration Release --no-restore
      - run: dotnet test Cutwork.sln --configuration Release --no-build --framework net10.0-windows10.0.19041.0
      - name: Portable archive integrity contracts
        shell: pwsh
        run: ./tests/packaging/portable-package.Tests.ps1
      - name: Publish and verify portable Windows package
        shell: pwsh
        run: ./product/packaging/publish-windows.ps1
      - name: Published editor and bridge with official MCP client
        shell: pwsh
        run: |
          dotnet run --project tests/Cutwork.WindowsSmoke -c Release -- artifacts/windows/FLAMORIS-Cutwork-win-x64
          if ($LASTEXITCODE -ne 0) { throw "Published MCP acceptance failed." }
      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: FLAMORIS-Cutwork-win-x64
          path: |
            artifacts/windows/FLAMORIS-Cutwork-win-x64.zip
            artifacts/windows/FLAMORIS-Cutwork-win-x64.inventory.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
