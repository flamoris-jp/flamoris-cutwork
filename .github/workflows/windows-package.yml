name: Windows Portable Package

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "*.sln"
      - "global.json"
      - "Directory.Build.props"
      - "eng/**"
      - "packaging/**"
      - "product/packaging/**"
      - "docs/phase8-windows-packaging.md"
      - "LICENSE"
      - "README.md"
      - ".github/workflows/windows-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Cutwork.sln
      - run: dotnet build Cutwork.sln --configuration Release --no-restore
      - run: dotnet test Cutwork.sln --configuration Release --no-build
      - name: Portable archive integrity contracts
        shell: pwsh
        run: ./tests/packaging/portable-package.Tests.ps1
      - name: Publish and verify portable Windows package
        shell: pwsh
        run: ./product/packaging/publish-windows.ps1
      - name: Published editor and bridge with official MCP client
        shell: pwsh
        run: |
          dotnet run --project tests/Cutwork.WindowsSmoke -c Release -- artifacts/windows/FLAMORIS-Cutwork-win-x64
          if ($LASTEXITCODE -ne 0) { throw "Published MCP acceptance failed." }
      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: FLAMORIS-Cutwork-win-x64
          path: |
            artifacts/windows/FLAMORIS-Cutwork-win-x64.zip
            artifacts/windows/FLAMORIS-Cutwork-win-x64.inventory.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
